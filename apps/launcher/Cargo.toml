[package]
name = "launcher"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rfd = "0.17.2"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
ureq = { version = "3.5.2", features = ["json"] }
windows = { workspace = true, features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation"] }
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_System_ProcessStatus", "Win32_UI_Shell"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
